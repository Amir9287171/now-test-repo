name: Decrypt Two Specific Analysis Files

on:
  workflow_dispatch:
    inputs:
      user_password:
        description: 'رمز رمزگشایی فایل‌های .enc (RESULTS_PASSWORD)'
        required: true
        type: string
      file1_path:
        description: 'مسیر کامل فایل اول (مثلاً analysis_results/combo_10day/Ttt3/BTCUSDT/file1.enc)'
        required: true
        type: string
      file2_path:
        description: 'مسیر کامل فایل دوم (اختیاری)'
        required: false
        type: string

permissions:
  contents: write
  actions: write

jobs:
  decrypt-two-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout third repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          repository: ${{ secrets.THIRD_REPO }}
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Prepare file list
        id: prepare
        run: |
          echo "${{ github.event.inputs.file1_path }}" > /tmp/files.txt
          if [ -n "${{ github.event.inputs.file2_path }}" ]; then
            echo "${{ github.event.inputs.file2_path }}" >> /tmp/files.txt
          fi
          echo "file_count=$(cat /tmp/files.txt | wc -l)" >> $GITHUB_OUTPUT
          echo "📋 فایل‌های انتخاب شده:"
          cat /tmp/files.txt

      - name: Decrypt and check files
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          echo "::add-mask::$USER_PASS"
          mkdir -p /tmp/decrypted
          TOTAL=$(cat /tmp/files.txt | wc -l)
          echo "=============================================="
          echo "   🔓 شروع رمزگشایی $TOTAL فایل"
          echo "=============================================="
          EMPTY_COUNT=0
          NON_EMPTY_COUNT=0
          EMPTY_FILES=""
          NON_EMPTY_FILES=""
          while IFS= read -r ENC_FILE; do
            if [ -z "$ENC_FILE" ]; then continue; fi
            # بررسی وجود فایل
            if [ ! -f "$ENC_FILE" ]; then
              echo "❌ فایل $ENC_FILE وجود ندارد!"
              continue
            fi
            BASE_NAME=$(basename "$ENC_FILE" .enc)
            CSV_NAME="${BASE_NAME}.csv"
            TMP_CSV="/tmp/decrypted/${CSV_NAME}"
            echo "----------------------------------------"
            echo "📄 پردازش: $ENC_FILE"
            node -e "
              const crypto=require('crypto'),fs=require('fs');
              const pass=process.env.USER_PASS;
              if (!pass) { console.error('❌ رمز وارد نشده است'); process.exit(1); }
              const data=fs.readFileSync('$ENC_FILE');
              const key=crypto.scryptSync(pass,'salt',32);
              const iv=data.slice(0,16),enc=data.slice(16);
              const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
              const dec=Buffer.concat([decipher.update(enc),decipher.final()]);
              fs.writeFileSync('$TMP_CSV',dec);
            " 2>/tmp/decrypt_error.log
            if [ $? -ne 0 ]; then
              echo "   ❌ خطا در رمزگشایی $BASE_NAME"
              cat /tmp/decrypt_error.log
              continue
            fi
            if [ ! -s "$TMP_CSV" ]; then
              echo "   ❌ فایل CSV تولید نشد یا خالی است"
              EMPTY_COUNT=$((EMPTY_COUNT+1))
              EMPTY_FILES="$EMPTY_FILES\n- $BASE_NAME (فایل خالی)"
              continue
            fi
            LINE_COUNT=$(wc -l < "$TMP_CSV")
            if [ "$LINE_COUNT" -le 1 ]; then
              echo "   ⚠️ فایل فقط header دارد – خالی محسوب می‌شود"
              EMPTY_COUNT=$((EMPTY_COUNT+1))
              EMPTY_FILES="$EMPTY_FILES\n- $BASE_NAME (فقط header)"
            else
              FIRST_DATA_LINE=$(sed -n '2p' "$TMP_CSV" | tr -d ' \r\n')
              if [ -z "$FIRST_DATA_LINE" ]; then
                echo "   ⚠️ خط دوم خالی است – فایل خالی محسوب می‌شود"
                EMPTY_COUNT=$((EMPTY_COUNT+1))
                EMPTY_FILES="$EMPTY_FILES\n- $BASE_NAME (خط دوم خالی)"
              else
                echo "   ✅ فایل معتبر است – $((LINE_COUNT-1)) ردیف داده دارد"
                NON_EMPTY_COUNT=$((NON_EMPTY_COUNT+1))
                NON_EMPTY_FILES="$NON_EMPTY_FILES\n- $BASE_NAME ($((LINE_COUNT-1)) ردیف)"
                echo ""
                echo "   📋 محتوای فایل $BASE_NAME :"
                echo "   ======================================="
                cat "$TMP_CSV" | sed 's/^/     /'
                echo "   ======================================="
                echo ""
              fi
            fi
            rm -f "$TMP_CSV"
          done < /tmp/files.txt

          echo "=============================================="
          echo "   📊 گزارش نهایی"
          echo "=============================================="
          echo "📂 تعداد کل فایل‌های بررسی شده: $TOTAL"
          echo "✅ فایل‌های دارای داده: $NON_EMPTY_COUNT"
          echo "❌ فایل‌های خالی (بدون داده): $EMPTY_COUNT"
          if [ "$EMPTY_COUNT" -gt 0 ]; then
            echo ""
            echo "📋 لیست فایل‌های خالی:"
            echo -e "$EMPTY_FILES"
          fi
          if [ "$NON_EMPTY_COUNT" -gt 0 ]; then
            echo ""
            echo "📋 لیست فایل‌های معتبر:"
            echo -e "$NON_EMPTY_FILES"
          fi

          echo "TOTAL=$TOTAL" > /tmp/report.txt
          echo "NON_EMPTY=$NON_EMPTY_COUNT" >> /tmp/report.txt
          echo "EMPTY=$EMPTY_COUNT" >> /tmp/report.txt
          echo "EMPTY_FILES=$EMPTY_FILES" >> /tmp/report.txt
          echo "NON_EMPTY_FILES=$NON_EMPTY_FILES" >> /tmp/report.txt

      - name: Wait 5 minutes and cleanup
        run: |
          echo "⏳ منتظر ۵ دقیقه می‌مانیم تا فایل‌های موقت پاک شوند..."
          sleep 300
          rm -rf /tmp/decrypted
          echo "🧹 پاکسازی کامل شد."

      - name: Save report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: decrypt-report-two-files
          path: /tmp/report.txt
