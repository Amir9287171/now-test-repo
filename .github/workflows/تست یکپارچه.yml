name: Show Metadata from Third Repo (Hardcoded)

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: 'نام استراتژی'
        required: true
        default: 'Test'

permissions:
  contents: write

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Clone third repository (hardcoded)
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          # ===== اینجا خودت اسم مخزن سوم رو بنویس =====
          THIRD_REPO="Amir9287171/now-test-repo"
          echo "📦 مخزن سوم: $THIRD_REPO"
          git clone https://x-access-token:${GH_TOKEN}@github.com/${THIRD_REPO}.git /tmp/third_repo

      - name: Decrypt and show metadata
        env:
          RESULTS_PASSWORD: ${{ secrets.RESULTS_PASSWORD || secrets.DATA_PASSWORD }}
          STRAT: ${{ github.event.inputs.strategy }}
        run: |
          cd /tmp/third_repo
          ENC_FILE="aggregated/${STRAT}/${STRAT}_trades.enc"

          if [ ! -f "$ENC_FILE" ]; then
            echo "❌ فایل $ENC_FILE وجود ندارد!"
            echo "📂 فایل‌های موجود در aggregated:"
            ls -la aggregated/ 2>/dev/null || echo "   (پوشه aggregated خالی است)"
            exit 1
          fi

          echo "✅ فایل پیدا شد: $ENC_FILE"
          cat "$ENC_FILE" | base64 -d > /tmp/trades.enc

          node -e "
            const crypto = require('crypto');
            const fs = require('fs');
            const pass = process.env.RESULTS_PASSWORD;
            if (!pass) { console.error('❌ RESULTS_PASSWORD تنظیم نشده!'); process.exit(1); }
            const data = fs.readFileSync('/tmp/trades.enc');
            const key = crypto.scryptSync(pass, 'salt', 32);
            const iv = data.slice(0, 16);
            const enc = data.slice(16);
            const decipher = crypto.createDecipheriv('aes-256-cbc', key, iv);
            const dec = Buffer.concat([decipher.update(enc), decipher.final()]);
            fs.writeFileSync('/tmp/all_trades.json', dec);
          "

          echo ""
          echo "=============================================="
          echo "📊 ساختار metadata برای استراتژی: $STRAT"
          echo "=============================================="
          jq '.metadata' /tmp/all_trades.json

          echo ""
          echo "🔍 بررسی move_percents:"
          jq -r '.metadata.move_percents // "❌ وجود ندارد"' /tmp/all_trades.json

          echo ""
          echo "🔍 بررسی stop_loss_initial:"
          jq -r '.metadata.stop_loss_initial // "❌ وجود ندارد"' /tmp/all_trades.json

          echo ""
          echo "🔍 بررسی max_move_percent:"
          jq -r '.metadata.max_move_percent // "❌ وجود ندارد"' /tmp/all_trades.json
