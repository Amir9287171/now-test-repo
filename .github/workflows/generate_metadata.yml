name: Generate Metadata (1.json)

on:
  schedule:
    - cron: "0 */5 * * *"   # هر 5 ساعت یکبار (fallback)
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: generate-metadata
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan strategies and create missing 1.json
        run: |
          mkdir -p strategies
          # برای زیرپوشه‌های موجود
          for strat_dir in strategies/*/; do
            if [ -d "$strat_dir" ]; then
              strat_name=$(basename "$strat_dir")
              meta_file="${strat_dir}1.json"
              if [ -f "$meta_file" ]; then
                echo "✅ $strat_name: 1.json already exists"
                continue
              fi
              js_file="strategies/${strat_name}.js"
              if [ ! -f "$js_file" ]; then
                echo "⚠️ $strat_name: neither 1.json nor ${strat_name}.js found. Skip."
                continue
              fi
              echo "🔧 $strat_name: generating 1.json from ${js_file}..."
              node -e "
                const fs = require('fs');
                const jsContent = fs.readFileSync('$js_file', 'utf8');
                let moveMatch = jsContent.match(/movePercent\s*:\s*\[(.*?)\]/s);
                let move_percents = [];
                if (moveMatch) {
                  let numbers = moveMatch[1].match(/[\d.]+/g);
                  if (numbers) move_percents = numbers.map(Number);
                }
                let slMatch = jsContent.match(/stopLossInitial\s*:\s*([\d.-]+)/);
                let stop_loss = slMatch ? parseFloat(slMatch[1]) : -2.0;
                let max_move = move_percents.length ? move_percents[move_percents.length-1] : null;
                const meta = {
                  move_percents: move_percents,
                  stop_loss_initial: stop_loss,
                  max_move_percent: max_move
                };
                fs.writeFileSync('$meta_file', JSON.stringify(meta, null, 2));
              "
              if [ -s "$meta_file" ]; then
                echo "✅ $strat_name: 1.json created"
              else
                echo "❌ $strat_name: failed to create 1.json"
              fi
            fi
          done

          # برای فایل‌های .js بدون پوشه
          for js_file in strategies/*.js; do
            [ -f "$js_file" ] || continue
            strat_name=$(basename "$js_file" .js)
            strat_dir="strategies/${strat_name}/"
            meta_file="${strat_dir}1.json"
            if [ -d "$strat_dir" ] && [ -f "$meta_file" ]; then
              continue
            fi
            mkdir -p "$strat_dir"
            echo "🔧 $strat_name: generating 1.json from ${js_file} (new folder)..."
            node -e "
              const fs = require('fs');
              const jsContent = fs.readFileSync('$js_file', 'utf8');
              let moveMatch = jsContent.match(/movePercent\s*:\s*\[(.*?)\]/s);
              let move_percents = [];
              if (moveMatch) {
                let numbers = moveMatch[1].match(/[\d.]+/g);
                if (numbers) move_percents = numbers.map(Number);
              }
              let slMatch = jsContent.match(/stopLossInitial\s*:\s*([\d.-]+)/);
              let stop_loss = slMatch ? parseFloat(slMatch[1]) : -2.0;
              let max_move = move_percents.length ? move_percents[move_percents.length-1] : null;
              const meta = {
                move_percents: move_percents,
                stop_loss_initial: stop_loss,
                max_move_percent: max_move
              };
              fs.writeFileSync('$meta_file', JSON.stringify(meta, null, 2));
            "
          done

      - name: Commit and push changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"
          git add strategies/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate missing 1.json for strategies"
            git pull --rebase
            git push
          fi

      - name: Re-run this workflow (continue cycle)
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          gh workflow run generate_metadata.yml --ref main --repo ${{ github.repository }}
