name: Decrypt and Extract Three Analysis Files (Golden + Portfolios + Reports)

on:
  workflow_dispatch:
    inputs:
      user_password:
        description: 'رمز رمزگشایی (RESULTS_PASSWORD)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  decrypt-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout third repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          repository: ${{ secrets.THIRD_REPO }}
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Decrypt and extract golden_scores.parquet.enc
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          echo "::add-mask::$USER_PASS"
          ENC_FILE="golden_scores.parquet.enc"
          if [ ! -f "$ENC_FILE" ]; then
            echo "⚠️ فایل $ENC_FILE وجود ندارد. از این فایل عبور می‌کنیم."
            exit 0
          fi
          echo "📄 پردازش: $ENC_FILE"
          node -e "
            const crypto=require('crypto'),fs=require('fs');
            const pass=process.env.USER_PASS;
            const data=fs.readFileSync('$ENC_FILE');
            const key=crypto.scryptSync(pass,'salt',32);
            const iv=data.slice(0,16),enc=data.slice(16);
            const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
            const dec=Buffer.concat([decipher.update(enc),decipher.final()]);
            fs.writeFileSync('golden_scores.tar.gz',dec);
          " 2>/tmp/decrypt_error.log
          if [ $? -ne 0 ]; then
            echo "❌ رمزگشایی $ENC_FILE ناموفق بود."
            cat /tmp/decrypt_error.log
            exit 0
          fi
          if [ ! -s golden_scores.tar.gz ]; then
            echo "⚠️ فایل رمزگشایی‌شده خالی است."
            exit 0
          fi
          echo "✅ رمزگشایی موفق شد. استخراج golden_scores.parquet از tar.gz..."
          tar -xzf golden_scores.tar.gz
          if [ -f golden_scores.parquet ]; then
            echo "✅ golden_scores.parquet استخراج شد."
            rm -f golden_scores.tar.gz golden_scores.parquet.enc
            echo "🗑️ فایل‌های موقت حذف شدند."
          else
            echo "⚠️ استخراج golden_scores.parquet ناموفق بود. فایل tar.gz باقی می‌ماند."
          fi

      - name: Decrypt and extract portfolios_scores.parquet.enc
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          ENC_FILE="analysis_results/portfolios_scores.parquet.enc"
          if [ ! -f "$ENC_FILE" ]; then
            echo "⚠️ فایل $ENC_FILE وجود ندارد. از این فایل عبور می‌کنیم."
            exit 0
          fi
          echo "📄 پردازش: $ENC_FILE"
          node -e "
            const crypto=require('crypto'),fs=require('fs');
            const pass=process.env.USER_PASS;
            const data=fs.readFileSync('$ENC_FILE');
            const key=crypto.scryptSync(pass,'salt',32);
            const iv=data.slice(0,16),enc=data.slice(16);
            const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
            const dec=Buffer.concat([decipher.update(enc),decipher.final()]);
            fs.writeFileSync('portfolios_scores.tar.gz',dec);
          " 2>/tmp/decrypt_error.log
          if [ $? -ne 0 ]; then
            echo "❌ رمزگشایی $ENC_FILE ناموفق بود."
            cat /tmp/decrypt_error.log
            exit 0
          fi
          if [ ! -s portfolios_scores.tar.gz ]; then
            echo "⚠️ فایل رمزگشایی‌شده خالی است."
            exit 0
          fi
          echo "✅ رمزگشایی موفق شد. استخراج portfolios_scores.parquet از tar.gz..."
          tar -xzf portfolios_scores.tar.gz
          if [ -f portfolios_scores.parquet ]; then
            echo "✅ portfolios_scores.parquet استخراج شد."
            rm -f portfolios_scores.tar.gz analysis_results/portfolios_scores.parquet.enc
            echo "🗑️ فایل‌های موقت حذف شدند."
          else
            echo "⚠️ استخراج portfolios_scores.parquet ناموفق بود. فایل tar.gz باقی می‌ماند."
          fi

      - name: Decrypt and extract reports.tar.gz.enc
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          ENC_FILE="reports.tar.gz.enc"
          if [ ! -f "$ENC_FILE" ]; then
            echo "⚠️ فایل $ENC_FILE وجود ندارد. از این فایل عبور می‌کنیم."
            exit 0
          fi
          echo "📄 پردازش: $ENC_FILE"
          node -e "
            const crypto=require('crypto'),fs=require('fs');
            const pass=process.env.USER_PASS;
            const data=fs.readFileSync('$ENC_FILE');
            const key=crypto.scryptSync(pass,'salt',32);
            const iv=data.slice(0,16),enc=data.slice(16);
            const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
            const dec=Buffer.concat([decipher.update(enc),decipher.final()]);
            fs.writeFileSync('reports.tar.gz',dec);
          " 2>/tmp/decrypt_error.log
          if [ $? -ne 0 ]; then
            echo "❌ رمزگشایی $ENC_FILE ناموفق بود."
            cat /tmp/decrypt_error.log
            exit 0
          fi
          if [ ! -s reports.tar.gz ]; then
            echo "⚠️ فایل رمزگشایی‌شده خالی است."
            exit 0
          fi
          echo "✅ رمزگشایی موفق شد. استخراج reports از tar.gz..."
          tar -xzf reports.tar.gz
          if [ -d reports ]; then
            echo "✅ پوشه reports استخراج شد."
            rm -f reports.tar.gz reports.tar.gz.enc
            echo "🗑️ فایل‌های موقت حذف شدند."
          else
            echo "⚠️ استخراج reports ناموفق بود. فایل tar.gz باقی می‌ماند."
          fi

      - name: Commit and push extracted files to third repo
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          # حذف فایل‌های رمزنگاری‌شده قدیمی (اختیاری)
          # rm -f golden_scores.parquet.enc analysis_results/portfolios_scores.parquet.enc reports.tar.gz.enc

          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ هیچ تغییری برای commit وجود ندارد."
          else
            git commit -m "Decrypt and extract files (run ${{ github.run_id }})"
            git pull --rebase origin main || true
            git push origin main
            echo "✅ تغییرات به مخزن سوم push شد."
          fi

      - name: Print final report
        run: |
          echo "=============================================="
          echo "   📋 گزارش نهایی"
          echo "=============================================="
          [ -f golden_scores.parquet ] && echo "✅ golden_scores.parquet (استخراج و ذخیره شد)"
          [ ! -f golden_scores.parquet ] && echo "⚠️ golden_scores.parquet وجود ندارد"
          [ -f analysis_results/portfolios_scores.parquet ] && echo "✅ portfolios_scores.parquet (استخراج و ذخیره شد)"
          [ ! -f analysis_results/portfolios_scores.parquet ] && echo "⚠️ portfolios_scores.parquet وجود ندارد"
          [ -d reports ] && echo "✅ reports (استخراج و ذخیره شد)"
          [ ! -d reports ] && echo "⚠️ reports وجود ندارد"
