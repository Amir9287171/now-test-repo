name: Decrypt and Store Files in Third Repo (No CSV)

on:
  workflow_dispatch:
    inputs:
      user_password:
        description: 'رمز رمزگشایی (RESULTS_PASSWORD)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  decrypt-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout third repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          repository: ${{ secrets.THIRD_REPO }}
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Decrypt golden_scores.parquet.enc (if exists)
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          echo "::add-mask::$USER_PASS"
          ENC_FILE="golden_scores.parquet.enc"
          DEC_FILE="golden_scores.parquet"
          if [ ! -f "$ENC_FILE" ]; then
            echo "⚠️ فایل $ENC_FILE وجود ندارد. از این فایل عبور می‌کنیم."
            exit 0
          fi
          echo "📄 پردازش: $ENC_FILE"
          node -e "
            const crypto=require('crypto'),fs=require('fs');
            const pass=process.env.USER_PASS;
            const data=fs.readFileSync('$ENC_FILE');
            const key=crypto.scryptSync(pass,'salt',32);
            const iv=data.slice(0,16),enc=data.slice(16);
            const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
            const dec=Buffer.concat([decipher.update(enc),decipher.final()]);
            fs.writeFileSync('$DEC_FILE',dec);
          " 2>/tmp/decrypt_error.log
          if [ $? -ne 0 ]; then
            echo "❌ رمزگشایی $ENC_FILE ناموفق بود."
            cat /tmp/decrypt_error.log
            exit 0
          fi
          if [ ! -s "$DEC_FILE" ]; then
            echo "⚠️ فایل رمزگشایی‌شده خالی است."
            exit 0
          fi
          echo "✅ $DEC_FILE رمزگشایی شد."

      - name: Decrypt portfolios_scores.parquet.enc (if exists)
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          ENC_FILE="analysis_results/portfolios_scores.parquet.enc"
          DEC_FILE="analysis_results/portfolios_scores.parquet"
          if [ ! -f "$ENC_FILE" ]; then
            echo "⚠️ فایل $ENC_FILE وجود ندارد. از این فایل عبور می‌کنیم."
            exit 0
          fi
          echo "📄 پردازش: $ENC_FILE"
          node -e "
            const crypto=require('crypto'),fs=require('fs');
            const pass=process.env.USER_PASS;
            const data=fs.readFileSync('$ENC_FILE');
            const key=crypto.scryptSync(pass,'salt',32);
            const iv=data.slice(0,16),enc=data.slice(16);
            const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
            const dec=Buffer.concat([decipher.update(enc),decipher.final()]);
            fs.writeFileSync('$DEC_FILE',dec);
          " 2>/tmp/decrypt_error.log
          if [ $? -ne 0 ]; then
            echo "❌ رمزگشایی $ENC_FILE ناموفق بود."
            cat /tmp/decrypt_error.log
            exit 0
          fi
          if [ ! -s "$DEC_FILE" ]; then
            echo "⚠️ فایل رمزگشایی‌شده خالی است."
            exit 0
          fi
          echo "✅ $DEC_FILE رمزگشایی شد."

      - name: Decrypt and extract reports.tar.gz.enc (if exists)
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          ENC_FILE="reports.tar.gz.enc"
          DEC_FILE="reports.tar.gz"
          if [ ! -f "$ENC_FILE" ]; then
            echo "⚠️ فایل $ENC_FILE وجود ندارد. از این فایل عبور می‌کنیم."
            exit 0
          fi
          echo "📄 پردازش: $ENC_FILE"
          node -e "
            const crypto=require('crypto'),fs=require('fs');
            const pass=process.env.USER_PASS;
            const data=fs.readFileSync('$ENC_FILE');
            const key=crypto.scryptSync(pass,'salt',32);
            const iv=data.slice(0,16),enc=data.slice(16);
            const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
            const dec=Buffer.concat([decipher.update(enc),decipher.final()]);
            fs.writeFileSync('$DEC_FILE',dec);
          " 2>/tmp/decrypt_error.log
          if [ $? -ne 0 ]; then
            echo "❌ رمزگشایی $ENC_FILE ناموفق بود."
            cat /tmp/decrypt_error.log
            exit 0
          fi
          if [ ! -s "$DEC_FILE" ]; then
            echo "⚠️ فایل رمزگشایی‌شده خالی است."
            exit 0
          fi
          echo "✅ $DEC_FILE رمزگشایی شد."

          # استخراج reports.tar.gz
          if [ -f "$DEC_FILE" ]; then
            echo "📦 استخراج reports.tar.gz ..."
            tar -xzf "$DEC_FILE"
            if [ $? -eq 0 ]; then
              echo "✅ reports.tar.gz استخراج شد."
              rm -f "$DEC_FILE"
              echo "🗑️ فایل فشرده حذف شد (فقط محتوای استخراج‌شده باقی ماند)."
            else
              echo "⚠️ استخراج reports.tar.gz ناموفق بود. فایل فشرده حفظ می‌شود."
            fi
          fi

      - name: Commit and push decrypted files to third repo
        run: |
          cd $GITHUB_WORKSPACE
          git config user.name "github-actions[bot]"
          git config user.email "actions@github.com"

          # حذف فایل‌های رمزنگاری‌شده قدیمی (اختیاری)
          # rm -f golden_scores.parquet.enc analysis_results/portfolios_scores.parquet.enc reports.tar.gz.enc

          git add -A
          if git diff --cached --quiet; then
            echo "ℹ️ هیچ تغییری برای commit وجود ندارد."
          else
            git commit -m "Decrypt and store files (run ${{ github.run_id }})"
            git pull --rebase origin main || true
            git push origin main
            echo "✅ تغییرات به مخزن سوم push شد."
          fi
