name: Decrypt and Print First 40 Rows (No Format Change)

on:
  workflow_dispatch:
    inputs:
      user_password:
        description: 'رمز رمزگشایی (RESULTS_PASSWORD)'
        required: true
        type: string

permissions:
  contents: write
  actions: write

jobs:
  decrypt-and-print:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout third repository
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.CROSS_REPO_TOKEN }}
          repository: ${{ secrets.THIRD_REPO }}
          ref: main
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Python and install pandas
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install pandas pyarrow

      - name: Decrypt golden_scores.parquet.enc (if exists)
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          echo "::add-mask::$USER_PASS"
          ENC_FILE="golden_scores.parquet.enc"
          DEC_FILE="golden_scores.parquet"
          if [ ! -f "$ENC_FILE" ]; then
            echo "⚠️ فایل $ENC_FILE وجود ندارد. از این فایل عبور می‌کنیم."
            exit 0
          fi
          echo "📄 پردازش: $ENC_FILE"
          node -e "
            const crypto=require('crypto'),fs=require('fs');
            const pass=process.env.USER_PASS;
            const data=fs.readFileSync('$ENC_FILE');
            const key=crypto.scryptSync(pass,'salt',32);
            const iv=data.slice(0,16),enc=data.slice(16);
            const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
            const dec=Buffer.concat([decipher.update(enc),decipher.final()]);
            fs.writeFileSync('$DEC_FILE',dec);
          " 2>/tmp/decrypt_error.log
          if [ $? -ne 0 ]; then
            echo "❌ رمزگشایی $ENC_FILE ناموفق بود."
            cat /tmp/decrypt_error.log
            exit 0
          fi
          if [ ! -s "$DEC_FILE" ]; then
            echo "⚠️ فایل رمزگشایی‌شده خالی است."
            exit 0
          fi
          echo "✅ $DEC_FILE رمزگشایی شد."

      - name: Decrypt portfolios_scores.parquet.enc (if exists)
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          ENC_FILE="analysis_results/portfolios_scores.parquet.enc"
          DEC_FILE="analysis_results/portfolios_scores.parquet"
          if [ ! -f "$ENC_FILE" ]; then
            echo "⚠️ فایل $ENC_FILE وجود ندارد. از این فایل عبور می‌کنیم."
            exit 0
          fi
          echo "📄 پردازش: $ENC_FILE"
          node -e "
            const crypto=require('crypto'),fs=require('fs');
            const pass=process.env.USER_PASS;
            const data=fs.readFileSync('$ENC_FILE');
            const key=crypto.scryptSync(pass,'salt',32);
            const iv=data.slice(0,16),enc=data.slice(16);
            const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
            const dec=Buffer.concat([decipher.update(enc),decipher.final()]);
            fs.writeFileSync('$DEC_FILE',dec);
          " 2>/tmp/decrypt_error.log
          if [ $? -ne 0 ]; then
            echo "❌ رمزگشایی $ENC_FILE ناموفق بود."
            cat /tmp/decrypt_error.log
            exit 0
          fi
          if [ ! -s "$DEC_FILE" ]; then
            echo "⚠️ فایل رمزگشایی‌شده خالی است."
            exit 0
          fi
          echo "✅ $DEC_FILE رمزگشایی شد."

      - name: Decrypt reports.tar.gz.enc (if exists)
        env:
          USER_PASS: ${{ github.event.inputs.user_password }}
        run: |
          ENC_FILE="reports.tar.gz.enc"
          DEC_FILE="reports.tar.gz"
          if [ ! -f "$ENC_FILE" ]; then
            echo "⚠️ فایل $ENC_FILE وجود ندارد. از این فایل عبور می‌کنیم."
            exit 0
          fi
          echo "📄 پردازش: $ENC_FILE"
          node -e "
            const crypto=require('crypto'),fs=require('fs');
            const pass=process.env.USER_PASS;
            const data=fs.readFileSync('$ENC_FILE');
            const key=crypto.scryptSync(pass,'salt',32);
            const iv=data.slice(0,16),enc=data.slice(16);
            const decipher=crypto.createDecipheriv('aes-256-cbc',key,iv);
            const dec=Buffer.concat([decipher.update(enc),decipher.final()]);
            fs.writeFileSync('$DEC_FILE',dec);
          " 2>/tmp/decrypt_error.log
          if [ $? -ne 0 ]; then
            echo "❌ رمزگشایی $ENC_FILE ناموفق بود."
            cat /tmp/decrypt_error.log
            exit 0
          fi
          if [ ! -s "$DEC_FILE" ]; then
            echo "⚠️ فایل رمزگشایی‌شده خالی است."
            exit 0
          fi
          echo "✅ $DEC_FILE رمزگشایی شد."

          # Extract reports.tar.gz and remove archive
          if [ -f "$DEC_FILE" ]; then
            echo "📦 استخراج reports.tar.gz ..."
            tar -xzf "$DEC_FILE"
            if [ $? -eq 0 ]; then
              echo "✅ reports.tar.gz استخراج شد."
              rm -f "$DEC_FILE"
              echo "🗑️ فایل فشرده حذف شد."
            else
              echo "⚠️ استخراج reports.tar.gz ناموفق بود."
            fi
          fi

      - name: Print first 40 rows of golden_scores.parquet
        if: hashFiles('golden_scores.parquet') != ''
        run: |
          echo "=============================================="
          echo "   📊 golden_scores.parquet — ۴۰ خط اول"
          echo "=============================================="
          python3 -c "
          import pandas as pd
          df = pd.read_parquet('golden_scores.parquet')
          print(df.head(40).to_string())
          "

      - name: Print first 40 rows of portfolios_scores.parquet
        if: hashFiles('analysis_results/portfolios_scores.parquet') != ''
        run: |
          echo "=============================================="
          echo "   📊 portfolios_scores.parquet — ۴۰ خط اول"
          echo "=============================================="
          python3 -c "
          import pandas as pd
          df = pd.read_parquet('analysis_results/portfolios_scores.parquet')
          print(df.head(40).to_string())
          "

      - name: Print reports content (if extracted)
        if: hashFiles('reports/*.json') != ''
        run: |
          echo "=============================================="
          echo "   📄 reports — محتوای فایل‌های JSON"
          echo "=============================================="
          find reports -name "*.json" -type f | while read -r f; do
            echo "=============================================="
            echo "📄 فایل: $f"
            echo "=============================================="
            cat "$f" | head -100
            echo ""
          done

      - name: Print final summary
        run: |
          echo "=============================================="
          echo "   📋 گزارش نهایی"
          echo "=============================================="
          [ -f golden_scores.parquet ] && echo "✅ golden_scores.parquet رمزگشایی شد (۴۰ خط اول چاپ شد)"
          [ ! -f golden_scores.parquet ] && echo "⚠️ golden_scores.parquet وجود نداشت"
          [ -f analysis_results/portfolios_scores.parquet ] && echo "✅ portfolios_scores.parquet رمزگشایی شد (۴۰ خط اول چاپ شد)"
          [ ! -f analysis_results/portfolios_scores.parquet ] && echo "⚠️ portfolios_scores.parquet وجود نداشت"
          [ -d reports ] && echo "✅ reports استخراج شد (محتوای JSON چاپ شد)"
          [ ! -d reports ] && echo "⚠️ reports وجود نداشت"
