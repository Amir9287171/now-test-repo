name: Delete backtest_results

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Delete backtest_results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -d "backtest_results" ]; then
            echo "🗑️ حذف پوشه backtest_results"
            rm -rf backtest_results
            git add -A
            git commit -m "delete backtest_results"
            git push origin main
            echo "✅ پوشه backtest_results حذف شد!"
          else
            echo "⏭️ پوشه backtest_results وجود ندارد"
          fi
